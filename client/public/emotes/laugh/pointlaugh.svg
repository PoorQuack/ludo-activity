<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs><radialGradient id="f" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff6a8"/><stop offset=".55" stop-color="#ffd23a"/><stop offset="1" stop-color="#f0a20c"/></radialGradient></defs>
<style>
.bounce{animation:bounce .4s ease-in-out infinite alternate}
.hand{transform-origin:96px 96px;animation:jab .4s ease-in-out infinite alternate}
.ha{transform-origin:100px 26px;animation:pop .8s ease-out infinite}
@keyframes bounce{from{transform:translateY(3px)}to{transform:translateY(-5px)}}
@keyframes jab{from{transform:translateX(0)}to{transform:translateX(6px)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}60%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
</style>
<g class="bounce">
<circle cx="56" cy="66" r="42" fill="url(#f)" stroke="#c07a00" stroke-width="3"/>
<path d="M32 54q8-10 16 0M62 54q8-10 16 0" fill="none" stroke="#3a2200" stroke-width="5" stroke-linecap="round"/>
<path d="M30 70q26 34 52 0z" fill="#5a1800" stroke="#3a2200" stroke-width="3" stroke-linejoin="round"/>
<path d="M34 71h44v5H34z" fill="#fff"/>
</g>
<g class="hand">
<path d="M84 98h30" stroke="#c07a00" stroke-width="13" stroke-linecap="round"/>
<path d="M84 98h30" stroke="#ffd23a" stroke-width="8" stroke-linecap="round"/>
<circle cx="84" cy="100" r="13" fill="url(#f)" stroke="#c07a00" stroke-width="3"/>
</g>
<g class="ha"><text x="100" y="34" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="26" fill="#ff4f4f" stroke="#fff" stroke-width="2" paint-order="stroke">HA!</text></g>
</svg>
