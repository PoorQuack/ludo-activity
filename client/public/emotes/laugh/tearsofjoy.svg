<style>
.shake{transform-origin:64px 70px;animation:shake .32s ease-in-out infinite}
.sl{transform-origin:30px 62px;animation:squirt .5s ease-out infinite}.sr{transform-origin:98px 62px;animation:squirt .5s ease-out .25s infinite}
@keyframes shake{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-4px)}}
@keyframes squirt{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.3) translateY(8px)}}
</style>
