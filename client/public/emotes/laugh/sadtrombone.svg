<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs><radialGradient id="b" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#d8ecff"/><stop offset=".55" stop-color="#8fc1f2"/><stop offset="1" stop-color="#5b8fc9"/></radialGradient></defs>
<style>
.slump{transform-origin:64px 110px;animation:slump 2s ease-in-out infinite}
.tear{animation:fall 1s ease-in infinite}
.txt{animation:fade 2s ease-in-out infinite}
@keyframes slump{0%,15%{transform:translateY(-6px) rotate(0)}70%,100%{transform:translateY(6px) rotate(-8deg)}}
@keyframes fall{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
@keyframes fade{0%,20%{opacity:0}40%,80%{opacity:1}100%{opacity:0}}
</style>
<g class="slump">
<circle cx="64" cy="70" r="44" fill="url(#b)" stroke="#3d6fa8" stroke-width="3"/>
<path d="M36 52l16 6M92 52l-16 6" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/>
<path d="M40 66q8-6 14 0M74 66q8-6 14 0" fill="none" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/>
<path d="M44 96q20-18 40 0" fill="none" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/>
<g class="tear"><path d="M48 72q-5 8-2 12t7-2q0-4-5-10z" fill="#e6f6ff" stroke="#3d8fd0" stroke-width="1.5"/></g>
</g>
<g class="txt"><text x="64" y="20" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#cfe6ff" stroke="#1d3557" stroke-width="2.5" paint-order="stroke">womp womp</text></g>
</svg>
